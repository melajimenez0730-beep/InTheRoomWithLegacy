<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="waxGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#9A4A0B; stop-opacity:1" />
      <stop offset="70%" style="stop-color:#8B2E00; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B1A00; stop-opacity:1" />
    </radialGradient>
    <filter id="waxTexture" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" result="displacement"/>
    </filter>
  </defs>
  
  <!-- Main wax seal circle -->
  <circle cx="100" cy="100" r="90" fill="url(#waxGradient)" filter="url(#waxTexture)"/>
  
  <!-- Inner design - Stylized "L" for Legacy -->
  <path d="M70,60 L70,140 L130,140" stroke="#F5EDD8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Decorative elements around the edge -->
  <g fill="#F5EDD8" opacity="0.8">
    <circle cx="100" cy="40" r="4"/>
    <circle cx="160" cy="100" r="4"/>
    <circle cx="100" cy="160" r="4"/>
    <circle cx="40" cy="100" r="4"/>
    
    <circle cx="132" cy="48" r="3"/>
    <circle cx="152" cy="68" r="3"/>
    <circle cx="152" cy="132" r="3"/>
    <circle cx="132" cy="152" r="3"/>
    <circle cx="68" cy="152" r="3"/>
    <circle cx="48" cy="132" r="3"/>
    <circle cx="48" cy="68" r="3"/>
    <circle cx="68" cy="48" r="3"/>
  </g>
  
  <!-- Subtle cracks and imperfections -->
  <g stroke="#6B1A00" stroke-width="0.5" opacity="0.3">
    <path d="M80,60 L85,70" />
    <path d="M120,80 L130,90" />
    <path d="M90,130 L100,140" />
    <path d="M60,110 L70,115" />
    <path d="M140,60 L145,65" />
  </g>
</svg>